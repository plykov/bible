name: Build & deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Upstream datasets are pinned in scripts/sources.json; cache them by that file.
      - uses: actions/cache@v4
        with:
          path: .cache/sources
          key: sources-${{ hashFiles('scripts/sources.json') }}

      - name: Fetch sources
        run: python scripts/fetch_sources.py

      - name: Build data
        run: python scripts/build_data.py

      - name: Test stemmer parity (Python vs JS)
        run: python scripts/test_stem.py

      - name: Test DSS / Masoretic word classifier
        run: python scripts/test_dss_compare.py

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    # Deploys only from the repository's default branch.
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
